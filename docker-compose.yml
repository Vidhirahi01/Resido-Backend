version: "3.9"
services:
  web:
    build: .
    container_name: resido-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://resido_user:resido_password@db:5432/resido_db
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./app:/app/app   # bind-mount for live code editing

  db:
    image: postgis/postgis:15-3.4
    container_name: resido-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: resido-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery:
    build: .
    container_name: resido-celery
    command: celery -A app.worker.celery worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://resido_user:resido_password@db:5432/resido_db
    depends_on:
      - redis
      - db
    volumes:
      - ./app:/app/app

  pgadmin:
    image: dpage/pgadmin4
    container_name: resido-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  redis_data:
  pgadmin_data:
